name: Android validation

on:
  workflow_dispatch:
    inputs:
      api:
        description: Source profile or validation group
        type: choice
        default: baseline
        options: [baseline, extended, all, '30', '31', '32', '33', '34', '35', '36', '37', '37-16k']
      system_receiver:
        description: Validate synthetic system receiver injection through normal consent UI
        type: boolean
        default: false
      candidate_patch_b64:
        description: Optional public Kotlin source patch; never include private data or credentials
        type: string
        default: ''
      candidate_base_sha:
        description: Exact checkout commit for the optional candidate
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.ref }}-${{ inputs.api }}
  cancel-in-progress: false

jobs:
  emulator:
    name: Android ${{ matrix.profile }} / mode ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        profile: ${{ fromJSON('{"baseline":["30","31","35"],"extended":["32","33","34","36","37","37-16k"],"all":["30","31","32","33","34","35","36","37","37-16k"],"30":["30"],"31":["31"],"32":["32"],"33":["33"],"34":["34"],"35":["35"],"36":["36"],"37":["37"],"37-16k":["37-16k"]}')[inputs.api] }}
        mode: ${{ fromJSON(inputs.system_receiver && '["off","on"]' || '["off"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply optional public-source candidate
        env:
          CANDIDATE_PATCH_B64: ${{ inputs.candidate_patch_b64 }}
          CANDIDATE_BASE_SHA: ${{ inputs.candidate_base_sha }}
        run: python3 tools/ci/apply_candidate.py
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Check validation driver
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'
      - name: Prepare Android SDK
        run: python3 tools/ci/run_emulator.py --profile '${{ matrix.profile }}' --prepare
      - name: Check clean checkout and build test APKs
        run: >-
          ./gradlew --no-daemon --max-workers=2 --console=plain
          :app:lintDebug :app:lintRelease :app:testDebugUnitTest
          :app:assembleDebug :app:assembleDebugAndroidTest
          :app:bundleReleaseClassesToCompileJar
      - name: Free disposable runner disk
        run: python3 tools/ci/free_runner_disk.py
      - name: Run isolated software fixtures
        run: >-
          python3 tools/ci/run_emulator.py --profile '${{ matrix.profile }}'
          --receiver-mode '${{ matrix.mode }}'
          ${{ inputs.system_receiver && '--system-receiver' || '' }}
