name: Optimized Android runtime

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Optimized runtime profile
        type: choice
        default: '30'
        options: ['30', '35-16k', '37-16k']

permissions:
  contents: read

concurrency:
  # Isolate profile validation while serializing retries for the same profile.
  group: optimized-runtime-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  optimized:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Check validation driver
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'
      - name: Prepare Android SDK
        run: python3 tools/ci/run_emulator.py --profile '${{ fromJSON('{"30":"30","35-16k":"35-16k","37-16k":"37-16k"}')[inputs.profile] }}' --prepare
      - name: Check and build optimized candidate
        run: >-
          ./gradlew --no-daemon --max-workers=2 --console=plain
          :app:lintDebug :app:lintRelease :app:testDebugUnitTest
          :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Free disposable runner disk
        run: python3 tools/ci/free_runner_disk.py
      - name: Verify optimized offline runtime and persistence
        run: >-
          python3 tools/ci/run_emulator.py --profile '${{ fromJSON('{"30":"30","35-16k":"35-16k","37-16k":"37-16k"}')[inputs.profile] }}'
          --system-receiver --receiver-mode off --optimized
